name: Build NutriAI Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Release APK (Flutter)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Initialize Android platform files
        working-directory: flutter_nutriai
        run: |
          flutter create . --platforms=android --org com.college.nutriai

      - name: Configure Android minSdk 23 and App Label
        working-directory: flutter_nutriai
        run: |
          # Ensure minSdk >= 23 for Firebase Auth / Firestore compatibility
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
          fi
          # Set launcher display name to NutriAI
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="nutri_ai"/android:label="NutriAI"/g' android/app/src/main/AndroidManifest.xml
          fi

      - name: Install Flutter dependencies
        working-directory: flutter_nutriai
        run: flutter pub get

      - name: Build Release APK
        working-directory: flutter_nutriai
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/NutriAI-release.apk

      - name: Upload NutriAI Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriAI-Android-APK
          path: flutter_nutriai/build/app/outputs/flutter-apk/NutriAI-release.apk
          retention-days: 30
